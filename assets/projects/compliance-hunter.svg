<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="compliance-hunter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <style>.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  </defs>
  <rect x="1" y="1" width="598" height="208" rx="16" fill="url(#bg)" stroke="#1f2b47" stroke-width="1.5"/>
  <rect x="1" y="24" width="4" height="162" rx="2" fill="#ef4444"/>
  <rect x="28" y="24" width="40" height="40" rx="10" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="48" y="49" class="m" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">ePO</text>
  <text x="82" y="52" class="m" font-size="21" font-weight="700" fill="#f1f5f9">compliance-hunter</text>
  <rect x="457" y="32" width="115" height="24" rx="12" fill="none" stroke="#22c55e" stroke-opacity=".7"/>
  <text x="514" y="48" class="m" font-size="11.5" fill="#22c55e" text-anchor="middle">mock ePO + CI</text>
  <text x="28" y="98" class="t" font-size="15" fill="#94a3b8">Daily Trellix ePO health check. Finds stale-DAT and silent</text><text x="28" y="120" class="t" font-size="15" fill="#94a3b8">hosts, tags and untags them through the ePO Web API and</text><text x="28" y="142" class="t" font-size="15" fill="#94a3b8">sends new / still / recovered alerts via webhook.</text>
