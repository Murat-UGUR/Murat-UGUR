<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Murat UĞUR — Security Technical Operations Specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cur{animation:blink 1.1s steps(1) infinite}
      @keyframes pulse{0%{r:3;opacity:1}100%{r:14;opacity:0}}
      .p{animation:pulse 2.4s ease-out infinite}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity=".55"/>

  <!-- network mesh (DXL fabric motif) -->
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.2" fill="none">
    <path d="M860 70 L960 120 L1080 80 L1130 170 L1010 220 L900 190 Z"/>
    <path d="M960 120 L1010 220 M960 120 L1130 170 M900 190 L1080 80"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="860" cy="70" r="4"/><circle cx="960" cy="120" r="5"/><circle cx="1080" cy="80" r="4"/>
    <circle cx="1130" cy="170" r="4"/><circle cx="1010" cy="220" r="4"/><circle cx="900" cy="190" r="4"/>
  </g>
  <circle class="p" cx="960" cy="120" r="3" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle class="p" cx="1010" cy="220" r="3" fill="none" stroke="#ef4444" stroke-width="2" style="animation-delay:1.2s"/>

  <!-- shield -->
  <g transform="translate(1000 135)" opacity=".9">
    <path d="M0 -42 L34 -28 V4 C34 26 18 40 0 48 C-18 40 -34 26 -34 4 V-28 Z" fill="#0b1220" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-13 3 L-3 13 L15 -8" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="64" y="92" class="m" font-size="16" fill="#22d3ee">$ whoami</text>
  <text x="64" y="148" class="t" font-size="52" font-weight="700" fill="#f1f5f9">Murat UĞUR</text>
  <rect x="64" y="166" width="140" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="206" class="t" font-size="22" fill="#cbd5e1">Security Technical Operations Specialist</text>
  <text x="64" y="240" class="m" font-size="15" fill="#94a3b8">Trellix · FireEye · ePO · EDR/EPP · DXL/TIE · DLP · Automation<tspan class="cur" fill="#22d3ee"> ▍</tspan></text>
</svg>
